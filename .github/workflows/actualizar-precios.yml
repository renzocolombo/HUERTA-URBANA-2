name: Actualizar Precios
concurrency:
  group: actualizar-precios
  cancel-in-progress: false
on:
  push:
    paths:
      - 'precios.json'
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - 'actualizar-precios'
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Actualizar precios en HTML
        run: node scripts/actualizar-precios.js
      - name: Commit y push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add index.html precios.json
          git diff --staged --quiet || git commit -m "feat: actualizar precios automáticamente"
          git pull origin main --rebase
          git push origin main
          sleep 5
