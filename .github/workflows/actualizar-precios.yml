name: Actualizar Precios
on:
  push:
    paths:
      - 'precios.json'
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [actualizar-precios]

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Configurar git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/renzocolombo/HUERTA-URBANA-2.git

      - name: Sincronizar con remoto
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Actualizar precios en HTML
        run: node scripts/actualizar-precios.js

      - name: Commit y push
        run: |
          git add index.html
          git diff --staged --quiet || git commit -m "feat: actualizar precios automáticamente"
          git push origin main
